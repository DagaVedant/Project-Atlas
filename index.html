<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Atlas - NASA HERC</title>
<style>
  :root {
    --bg: #0b0f14;
    --fg: #e8ecef;
    --muted: #9aa5b1;
    --accent: #d64545;
    --rule: #22282f;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
  }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: Georgia, 'Times New Roman', serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }

  main {
    max-width: 640px;
    text-align: center;
  }

  .eyebrow {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 0.75rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 1rem;
  }

  h1 {
    font-size: clamp(2.5rem, 8vw, 4.5rem);
    margin: 0 0 1.25rem;
    font-weight: 400;
    letter-spacing: 0.02em;
  }

  p {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 1.05rem;
    line-height: 1.6;
    color: var(--muted);
    margin: 0 0 0.5rem;
  }

  hr {
    width: 56px;
    border: none;
    border-top: 1px solid var(--rule);
    margin: 1.75rem auto;
  }

  .school {
    color: var(--fg);
  }
</style>
</head>
<body>
<main>
  <p class="eyebrow">NASA Human Exploration Rover Challenge</p>
  <h1>Project Atlas</h1>
  <hr>
  <p>Competing in the <strong>Rover Challenge &mdash; High School Division</strong></p>
  <p class="school">Edison Academy Magnet School</p>
</main>
</body>
</html>
